name: CI

on:
  pull_request:
    branches: [main]

# PR을 연달아 푸시하면 이전 run을 취소한다. 같은 공용 리소스를 중복 점유하지 않기 위함이다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint / typecheck / build / drizzle-kit check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # setup-node의 pnpm 캐시가 pnpm store 경로를 필요로 하므로 pnpm을 먼저 설치한다.
      # package.json의 packageManager 필드를 쓰지 않는 이유: pnpm 12가 그 필드를
      # lockfile의 packageManagerDependencies에 기록하면서 전 플랫폼 바이너리
      # 158줄을 추가해 --frozen-lockfile을 깨뜨린다. 버전은 여기서만 고정한다.
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      # lint·typecheck가 못 잡는 빌드 전용 실패를 잡는다("use client" 경계, next/font,
      # metadata export, RSC에서의 클라이언트 전용 API).
      # DATABASE_URL은 더미여도 된다. src/db/index.ts가 모듈 로드 시점에 부재를 throw하지만
      # postgres()는 지연 접속이라 실제로 붙지 않는다. 실제 자격증명을 CI에 두지 않기 위한 값이다.
      - run: pnpm build
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci

      # DATABASE_URL이 없어도 통과한다. check는 drizzle/meta 스냅샷만 읽고 DB에 접속하지 않는다.
      - run: pnpm drizzle-kit check

      # pnpm test는 의도적으로 제외했다. 실제 Supabase 공용 인스턴스(트랜잭션 풀러)에
      # 붙기 때문에 CI 병렬 run이 커넥션을 재배치해 prepared statement를 깨뜨린다.
      # 전용 테스트 DB 확보 후 Phase 4에서 편입한다 (requirement.md NFR-006).
